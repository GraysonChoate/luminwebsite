<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumin Ecosystem — Idle</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}

  /* ---- the component ---------------------------------------------
     Two copies of the same clip, offset by the fade length. While one
     is ending, the other has already restarted on top of it, and the
     incoming copy fades in. The blend spreads over ~24 frames of real
     playback, so the loop point can never read as a cut.

     ONLY THE TOP LAYER FADES. If both faded at once the composite
     would be t*new + (1-t)^2*old, which sums to 0.75 at the midpoint
     and dips the whole image 25% darker every loop. Holding the
     outgoing layer fully opaque underneath keeps the weights at 1.
  ------------------------------------------------------------------ */
  .lumin-idle{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
  .lumin-idle video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    opacity:1;
  }
  .lumin-idle video.fading{transition:opacity var(--fade,600ms) linear}
</style>
</head>
<body>

<div class="lumin-idle" id="idle" style="--fade:600ms">
  <video class="a" muted playsinline preload="auto"
         poster="lumin-ecosystem-idle-poster.jpg">
    <source src="lumin-ecosystem-idle-web.webm" type="video/webm">
    <source src="lumin-ecosystem-idle-web.mp4"  type="video/mp4">
  </video>
  <video class="b" muted playsinline preload="auto" style="opacity:0">
    <source src="lumin-ecosystem-idle-web.webm" type="video/webm">
    <source src="lumin-ecosystem-idle-web.mp4"  type="video/mp4">
  </video>
</div>

<script>
(function(){
  const FADE = 0.6;                       // seconds — matches --fade
  const root = document.getElementById('idle');
  const a = root.querySelector('.a');
  const b = root.querySelector('.b');
  let front = a, back = b, armed = false;

  function start(){
    if (start.done) return; start.done = true;
    a.play().catch(()=>{});
  }
  a.addEventListener('canplay', start, {once:true});

  // When the front copy is FADE seconds from the end, restart the other
  // copy on top of it and fade ONLY that one in. The outgoing copy is
  // left fully opaque underneath, so total brightness stays at 1.
  function tick(){
    const d = front.duration;
    if (d && front.currentTime >= d - FADE && !armed){
      armed = true;

      back.style.zIndex = 2;               // incoming sits on top
      front.style.zIndex = 1;              // outgoing stays lit below
      back.classList.remove('fading');
      back.style.opacity = 0;              // reset with no transition
      back.currentTime = 0;
      back.play().catch(()=>{});

      requestAnimationFrame(() => {        // let opacity:0 commit first
        back.classList.add('fading');
        back.style.opacity = 1;
      });

      setTimeout(() => {
        front.pause();
        front.classList.remove('fading');
        front.style.opacity = 0;           // now hidden beneath the top layer
        const t = front; front = back; back = t;
        armed = false;
      }, FADE*1000);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Don't burn cycles when the section isn't on screen
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) front.play().catch(()=>{});
    else { a.pause(); b.pause(); }
  }), {threshold:0.01});
  io.observe(root);
})();
</script>
</body>
</html>
