<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumin — Ecosystem idle loop</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  /* Pure black full-bleed section — exactly how the real site section behaves. */
  .section{position:fixed;inset:0;background:#000;overflow:hidden}
  /* contain = the ENTIRE frame is always shown. Cannot clip. Black margins blend into the section. */
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#000}
  /* tiny dev-only speed control, deliberately ugly so it's obviously not part of the design */
  .dev{position:absolute;bottom:10px;right:12px;display:flex;gap:6px;z-index:5;opacity:.5}
  .dev button{background:#0e1424;color:#8fb4ff;border:1px solid #23304f;border-radius:5px;
    padding:4px 8px;font:11px ui-sans-serif,system-ui;cursor:pointer}
</style>
</head>
<body>
  <section class="section">
    <video id="v" src="/eco/clips/eco-idle.mp4" autoplay muted loop playsinline></video>
    <div class="dev">
      <button onclick="v.playbackRate=0.5">0.5×</button>
      <button onclick="v.playbackRate=1">1×</button>
    </div>
  </section>
</body>
</html>
